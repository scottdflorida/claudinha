name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem first, then the proposed solution — it's easier to evaluate when the motivation is clear.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's hard or awkward today?
      placeholder: "When I'm running 8 sessions at once, I can't tell which ones…"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Claudinha to do? UI sketches, screenshots, or rough descriptions all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other approaches you'd be happy with.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help — links, related issues, prior art in other tools, etc.

name: Release

# Builds unsigned Claudinha installers for macOS, Windows, and Linux on every
# tag push (vX.Y.Z) and uploads them as a draft GitHub Release via
# electron-builder's --publish=always. Review the draft in the GitHub UI and
# click "Publish release" once you've smoke-tested the artifacts.
#
# Builds are NOT code-signed or notarized. macOS users will see a Gatekeeper
# warning on first launch (right-click → Open → Open); Windows users may see
# SmartScreen. The README documents this for end users.
#
# Manual trigger via workflow_dispatch is preserved as a fallback for
# rebuilding a release without bumping the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build and publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing: CSC_IDENTITY_AUTO_DISCOVERY=false prevents electron-builder
          # from attempting to pick up a local/keychain identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish=always --mac

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=always --win

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=always --linux

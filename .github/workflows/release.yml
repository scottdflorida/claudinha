name: Release

# Builds unsigned Claudinha installers for macOS, Windows, and Linux on every
# tag push (vX.Y.Z) and attaches them to a single draft GitHub Release.
# Review the draft in the GitHub UI and click "Publish release" once you've
# smoke-tested the artifacts.
#
# Two-stage flow:
#   1. `build` (matrix per platform) — runs typecheck, tests (mac/linux only),
#      and electron-builder with --publish=never. Each platform uploads its
#      `dist/` artifacts as a workflow artifact.
#   2. `release` (single job, runs after all platforms build) — downloads
#      every platform's artifacts and creates one draft release.
#
# This avoids the "duplicate draft per platform" race that electron-builder's
# --publish=always hits when the matrix runs in parallel: GitHub draft
# releases aren't tag-indexed, so each parallel job thinks no release exists
# yet and creates its own.
#
# Builds are NOT code-signed or notarized. macOS users will see a Gatekeeper
# warning on first launch (right-click → Open → Open); Windows users may see
# SmartScreen. The README documents this for end users.
#
# Manual trigger via workflow_dispatch is preserved as a fallback for
# rebuilding a release without bumping the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-gyp (used by node-pty's postinstall rebuild) still imports
      # distutils, which was removed from Python in 3.12. macos-latest
      # runners ship Python 3.12+, so the build fails without an explicit
      # pin. Pin globally — harmless on Linux/Windows and protects against
      # the same drift on those runners.
      - name: Set up Python (for node-gyp distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Skip on Windows: a handful of tests in tests/permissions-manager.test.ts
      # and tests/metrics-collector.test.ts hardcode Unix path separators and
      # .sh extensions in their expectations even though the source code is
      # platform-aware. Tests still gate mac + Linux. TODO: make those tests
      # cross-platform so we can re-enable here.
      - name: Run tests
        if: matrix.platform != 'win'
        run: npm test

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        env:
          # No signing: CSC_IDENTITY_AUTO_DISCOVERY=false prevents electron-builder
          # from attempting to pick up a local/keychain identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish=never --mac

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: npm run dist -- --publish=never --win

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist -- --publish=never --linux

      - name: Upload installers (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh artifacts/

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true

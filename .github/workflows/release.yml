name: Release

# Builds unsigned Claudinha installers for macOS, Windows, and Linux
# whenever a vX.Y.Z tag is pushed, and uploads them to the matching
# GitHub Release via electron-builder's --publish=always flag.
#
# Builds are NOT code-signed or notarized. See README for the user-facing
# consequences (Gatekeeper / SmartScreen warnings on first launch).

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (macOS)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing: CSC_IDENTITY_AUTO_DISCOVERY=false prevents electron-builder
          # from attempting to pick up a local/keychain identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish=always --mac

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=always --win

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish=always --linux

appId: com.claudinha.app
productName: Claudinha
copyright: Copyright © 2026 Claudinha

directories:
  output: dist

files:
  - out/**/*
  - assets/**/*
  # icon-dev.png is the badged "DEV" icon used only by `npm run dev` to
  # disambiguate the dev process from an installed copy in the dock; it has
  # no purpose inside a packaged installer.
  - "!assets/icons/icon-dev.png"

# scripts/ ships as extraResources (outside app.asar) so the relay scripts
# can be exec'd by external processes — Claude Code shells out to them via
# /bin/sh, which cannot traverse into the asar archive (it's a file, not a
# directory). Keeping them outside the asar is the only way the resulting
# absolute path can be resolved by a non-Electron process.
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
      - "!icons/icon-dev.png"
  - from: scripts
    to: scripts

mac:
  icon: assets/icons/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Code signing: set CSC_LINK and CSC_KEY_PASSWORD env vars for production builds
  # identity: null  # uncomment to build unsigned locally

win:
  icon: assets/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Code signing: set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD env vars for production builds

linux:
  icon: assets/icons/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
